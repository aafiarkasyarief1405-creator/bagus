<script>
  // 1. Canvas Particle
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, particles = [];

  function initCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    particles = [];
    const particleCount = window.innerWidth < 768 ? 40 : 100;
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width, y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        speedX: (Math.random() - 0.5) * 0.5, speedY: (Math.random() - 0.5) * 0.5,
        alpha: Math.random() * 0.5 + 0.1
      });
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.x += p.speedX; p.y += p.speedY;
      if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 191, 255, ${p.alpha})`;
      ctx.shadowBlur = 10; ctx.shadowColor = '#00bfff'; ctx.fill(); ctx.shadowBlur = 0;

      for (let j = i + 1; j < particles.length; j++) {
        let p2 = particles[j];
        let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 120) {
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0, 191, 255, ${(1 - (dist / 120)) * 0.2})`;
          ctx.lineWidth = 0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', initCanvas);
  initCanvas(); drawParticles();
  document.getElementById('year').textContent = new Date().getFullYear();

  // 2. Audio Logic
  const musicBtn = document.getElementById('music-btn');
  const musicStatus = document.getElementById('music-status');
  const bgMusic = document.getElementById('bg-music');
  const audioHint = document.getElementById('audio-hint');
  let isPlaying = false;

  function tryAutoplay() {
    bgMusic.play().then(() => {
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
      isPlaying = true;
    }).catch(e => {
      console.log('Autoplay mutlak diblokir, nunggu sentuhan.');
    });
  }

  window.addEventListener('load', tryAutoplay);

  function enableAudio(e) {
    if (e && e.target && e.target.closest('a')) return;

    if (!isPlaying) {
      bgMusic.play().catch(() => {});
      isPlaying = true;
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
    }
    
    bgMusic.muted = false;
    bgMusic.volume = 0.8;
    audioHint.classList.add('hide');

    ['click', 'touchstart', 'scroll', 'mousemove', 'keydown'].forEach(evt => {
      document.removeEventListener(evt, enableAudio);
    });
  }

  ['click', 'touchstart', 'scroll', 'mousemove', 'keydown'].forEach(evt => {
    document.addEventListener(evt, enableAudio, { passive: true, once: true });
  });

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    if (isPlaying) {
      bgMusic.pause();
      musicStatus.textContent = 'Nyalakan Lagu';
      musicBtn.classList.remove('playing');
      isPlaying = false;
      audioHint.classList.remove('hide');
    } else {
      bgMusic.muted = false;
      bgMusic.volume = 0.8;
      bgMusic.play();
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
      isPlaying = true;
      audioHint.classList.add('hide');
    }
  });
</script>
</body>

<script>
  // 1. Canvas Particle
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, particles = [];

  function initCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    particles = [];
    const particleCount = window.innerWidth < 768 ? 40 : 100;
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width, y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        speedX: (Math.random() - 0.5) * 0.5, speedY: (Math.random() - 0.5) * 0.5,
        alpha: Math.random() * 0.5 + 0.1
      });
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.x += p.speedX; p.y += p.speedY;
      if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 191, 255, ${p.alpha})`;
      ctx.shadowBlur = 10; ctx.shadowColor = '#00bfff'; ctx.fill(); ctx.shadowBlur = 0;

      for (let j = i + 1; j < particles.length; j++) {
        let p2 = particles[j];
        let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 120) {
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0, 191, 255, ${(1 - (dist / 120)) * 0.2})`;
          ctx.lineWidth = 0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', initCanvas);
  initCanvas(); drawParticles();
  document.getElementById('year').textContent = new Date().getFullYear();

  // 2. Audio Logic
  const musicBtn = document.getElementById('music-btn');
  const musicStatus = document.getElementById('music-status');
  const bgMusic = document.getElementById('bg-music');
  const audioHint = document.getElementById('audio-hint');
  let isPlaying = false;

  function tryAutoplay() {
    bgMusic.play().then(() => {
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
      isPlaying = true;
    }).catch(e => {
      console.log('Autoplay mutlak diblokir, nunggu sentuhan.');
    });
  }

  window.addEventListener('load', tryAutoplay);

  function enableAudio(e) {
    if (e && e.target && e.target.closest('a')) return;

    if (!isPlaying) {
      bgMusic.play().catch(() => {});
      isPlaying = true;
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
    }
    
    bgMusic.muted = false;
    bgMusic.volume = 0.8;
    audioHint.classList.add('hide');

    ['click', 'touchstart', 'scroll', 'mousemove', 'keydown'].forEach(evt => {
      document.removeEventListener(evt, enableAudio);
    });
  }

  ['click', 'touchstart', 'scroll', 'mousemove', 'keydown'].forEach(evt => {
    document.addEventListener(evt, enableAudio, { passive: true, once: true });
  });

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    if (isPlaying) {
      bgMusic.pause();
      musicStatus.textContent = 'Nyalakan Lagu';
      musicBtn.classList.remove('playing');
      isPlaying = false;
      audioHint.classList.remove('hide');
    } else {
      bgMusic.muted = false;
      bgMusic.volume = 0.8;
      bgMusic.play();
      musicStatus.textContent = 'Pause Melting';
      musicBtn.classList.add('playing');
      isPlaying = true;
      audioHint.classList.add('hide');
    }
  });
</script>
